name: Backend tests (Python + PostgreSQL)

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_USER: kms_test
          POSTGRES_PASSWORD: kms_test_password
          POSTGRES_DB: kms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kms_test -d kms_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: ${{ github.workspace }}/app
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: kms_test
      DB_PASSWORD: kms_test_password
      DB_NAME: kms_ci
      KMS_TEST_DATABASE_URL: postgresql+psycopg2://kms_test:kms_test_password@localhost:5432/kms_ci
      SECRET_KEY: ci-only-test-secret-key-0123456789abcdef
      TOKEN_LIFETIME_MINUTES: '30'
      TOKEN_ALGORITHM: HS256
      S3_ENDPOINT: https://storage.yandexcloud.net
      S3_ACCESS_KEY: dummy-ci-access-key
      S3_SECRET_KEY: dummy-ci-secret-key
      S3_BUCKET: dummy-ci-bucket
      S3_REGION: ru-central1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check PostgreSQL 18 and server-side pgvector availability
        run: |
          python - <<'PYCODE'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["KMS_TEST_DATABASE_URL"], hide_parameters=True)
          with engine.connect() as connection:
              assert 180000 <= int(connection.scalar(text("SHOW server_version_num"))) < 190000
              assert connection.scalar(text("SELECT count(*) FROM pg_available_extensions WHERE name='vector'")) == 1
              assert connection.scalar(text("SELECT rolsuper FROM pg_roles WHERE rolname=current_user")), "Migration tests require CREATE EXTENSION privileges"
          engine.dispose()
          PYCODE

      - name: Run all tests (fail on errors, zero tests, or skips)
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          count = suite.countTestCases()
          if count == 0:
              sys.exit("ERROR: no tests discovered")

          result = unittest.TextTestRunner(verbosity=2).run(suite)
          print(f"Discovered: {count}; failures: {len(result.failures)}; "
                f"errors: {len(result.errors)}; skipped: {len(result.skipped)}")
          if not result.wasSuccessful() or result.skipped:
              sys.exit(1)
          PY
