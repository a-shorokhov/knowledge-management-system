services:
  api:
    build: .
    environment: &app_environment
      AI_ENABLED: ${AI_ENABLED:-false}
      YANDEX_AI_FOLDER_ID: ${YANDEX_AI_FOLDER_ID:-}
      YANDEX_AI_API_KEY: ${YANDEX_AI_API_KEY:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-deepseek-v4.1-flash}
      AI_EMBED_DOC_MODEL: ${AI_EMBED_DOC_MODEL:-text-embeddings-v2-doc/latest}
      AI_EMBED_QUERY_MODEL: ${AI_EMBED_QUERY_MODEL:-text-embeddings-v2-query/latest}
      AI_EMBED_DIM: 256
      AI_TOP_K: 5
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TOKEN_LIFETIME_MINUTES: ${TOKEN_LIFETIME_MINUTES:-30}
      TOKEN_ALGORITHM: ${TOKEN_ALGORITHM:-HS256}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-ru-central1}
      CORS_ORIGINS: '${CORS_ORIGINS:-[]}'
      FILE_CLEANUP_DIR: /var/lib/kms/file-cleanup
    volumes:
      - file_cleanup_data:/var/lib/kms/file-cleanup
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "app/worker.py"]
    environment: *app_environment
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:0.8.7-pg18-bookworm
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  file_cleanup_data:
