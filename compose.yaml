services:
  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TOKEN_LIFETIME_MINUTES: ${TOKEN_LIFETIME_MINUTES:-30}
      TOKEN_ALGORITHM: ${TOKEN_ALGORITHM:-HS256}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://storage.yandexcloud.net}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      S3_REGION: ${S3_REGION:-ru-central1}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
